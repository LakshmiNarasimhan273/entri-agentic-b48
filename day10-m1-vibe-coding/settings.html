<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM App - Settings</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        .settings-header h2 {
            font-size: var(--font-size-xl);
            color: var(--color-dark);
        }
        .profile-section,
        .password-section,
        .notifications-section {
            margin-bottom: var(--spacing-xl);
        }
        .profile-section h3,
        .password-section h3,
        .notifications-section h3 {
            font-size: var(--font-size-lg);
            margin-bottom: var(--spacing-md);
            color: var(--color-primary);
            border-bottom: 1px solid var(--color-neutral-200);
            padding-bottom: var(--spacing-sm);
        }
        .avatar-upload {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: var(--border-radius-full);
            background-color: var(--color-neutral-300);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-xxl);
            color: var(--color-neutral-600);
            overflow: hidden;
        }
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-md);
        }
        @media (min-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .form-actions {
            margin-top: var(--spacing-lg);
            display: flex;
            justify-content: flex-end;
            gap: var(--spacing-md);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }
        .checkbox-group input[type="checkbox"] {
            margin-right: var(--spacing-xs);
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">CRM App</div>
            </div>
            <nav class="sidebar-nav">
                <ul class="sidebar-nav-list">
                    <li class="sidebar-nav-item"><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                    <li class="sidebar-nav-item"><a href="contacts.html"><i class="fas fa-address-book"></i> <span>Contacts</span></a></li>
                    <li class="sidebar-nav-item"><a href="pipeline.html"><i class="fas fa-project-diagram"></i> <span>Pipeline</span></a></li>
                    <li class="sidebar-nav-item"><a href="settings.html" class="active"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
                    <li class="sidebar-nav-item"><a href="index.html"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
                </ul>
            </nav>
        </div>
        <div class="topbar">
            <h2>Settings</h2>
        </div>
        <main class="main-content">
            <div class="settings-header">
                <h2>User Settings</h2>
            </div>

            <div class="card profile-section">
                <h3>Profile Information</h3>
                <form>
                    <div class="avatar-upload">
                        <div class="avatar-preview">
                            <i class="fas fa-user"></i>
                            <!-- <img src="path/to/avatar.jpg" alt="User Avatar"> -->
                        </div>
                        <button type="button" class="btn btn-secondary">Upload New Avatar</button>
                    </div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" class="input-field" value="John Doe">
                        </div>
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="input-field" value="john.doe@example.com">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Profile</button>
                    </div>
                </form>
            </div>

            <div class="card password-section">
                <h3>Change Password</h3>
                <form>
                    <div class="form-grid">
                        <div class="input-group full-width">
                            <label for="current-password">Current Password</label>
                            <input type="password" id="current-password" class="input-field" placeholder="********">
                        </div>
                        <div class="input-group">
                            <label for="new-password">New Password</label>
                            <input type="password" id="new-password" class="input-field" placeholder="********">
                        </div>
                        <div class="input-group">
                            <label for="confirm-new-password">Confirm New Password</label>
                            <input type="password" id="confirm-new-password" class="input-field" placeholder="********">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Change Password</button>
                    </div>
                </form>
            </div>

            <div class="card notifications-section">
                <h3>Notification Preferences</h3>
                <form>
                    <div class="checkbox-group">
                        <input type="checkbox" id="email-notifications" checked>
                        <label for="email-notifications">Email Notifications</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="app-notifications" checked>
                        <label for="app-notifications">In-App Notifications</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="marketing-emails">
                        <label for="marketing-emails">Marketing Emails</label>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Preferences</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
