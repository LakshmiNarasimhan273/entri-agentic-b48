<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM App - Sign Up</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--color-neutral-100);
        }
        .signup-container {
            background-color: var(--color-bg-light);
            padding: var(--spacing-xl);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .signup-container h1 {
            font-size: var(--font-size-xl);
            color: var(--color-primary);
            margin-bottom: var(--spacing-lg);
        }
        .input-group {
            margin-bottom: var(--spacing-md);
            text-align: left;
        }
        .form-actions {
            margin-top: var(--spacing-lg);
        }
        .form-actions .btn {
            width: 100%;
        }
        .link-text {
            margin-top: var(--spacing-md);
            font-size: var(--font-size-sm);
        }
        .link-text a {
            color: var(--color-primary);
            font-weight: var(--font-weight-medium);
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>Create Account</h1>
        <form>
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" class="input-field" placeholder="Your Full Name">
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="input-field" placeholder="your@example.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-field" placeholder="********">
            </div>
            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" class="input-field" placeholder="********">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </div>
        </form>
        <div class="link-text">
            Already have an account? <a href="index.html">Login</a>
        </div>
    </div>
</body>
</html>
