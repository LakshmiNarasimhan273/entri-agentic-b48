<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM App - Dashboard</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }
        .dashboard-card .card-body {
            text-align: center;
        }
        .dashboard-card .card-body .value {
            font-size: var(--font-size-xxl);
            font-weight: var(--font-weight-bold);
            color: var(--color-primary);
            margin-bottom: var(--spacing-xs);
        }
        .dashboard-card .card-body .label {
            font-size: var(--font-size-md);
            color: var(--color-neutral-600);
        }

        .activity-list .activity-item {
            display: flex;
            align-items: center;
            padding: var(--spacing-md) 0;
            border-bottom: 1px solid var(--color-neutral-200);
        }
        .activity-list .activity-item:last-child {
            border-bottom: none;
        }
        .activity-list .activity-icon {
            font-size: var(--font-size-lg);
            color: var(--color-secondary);
            margin-right: var(--spacing-md);
        }
        .activity-list .activity-details {
            flex-grow: 1;
        }
        .activity-list .activity-details .title {
            font-weight: var(--font-weight-medium);
            color: var(--color-text-dark);
        }
        .activity-list .activity-details .time {
            font-size: var(--font-size-sm);
            color: var(--color-neutral-500);
        }

        /* Responsive adjustments */
        @media (max-width: 639px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">CRM App</div>
            </div>
            <nav class="sidebar-nav">
                <ul class="sidebar-nav-list">
                    <li class="sidebar-nav-item"><a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                    <li class="sidebar-nav-item"><a href="contacts.html"><i class="fas fa-address-book"></i> <span>Contacts</span></a></li>
                    <li class="sidebar-nav-item"><a href="pipeline.html"><i class="fas fa-project-diagram"></i> <span>Pipeline</span></a></li>
                    <li class="sidebar-nav-item"><a href="settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
                    <li class="sidebar-nav-item"><a href="index.html"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
                </ul>
            </nav>
        </div>
        <div class="topbar">
            <h2>Dashboard</h2>
        </div>
        <main class="main-content">
            <div class="dashboard-grid">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <div class="value">120</div>
                        <div class="label">Total Contacts</div>
                    </div>
                </div>
                <div class="card dashboard-card">
                    <div class="card-body">
                        <div class="value">45</div>
                        <div class="label">Total Leads</div>
                    </div>
                </div>
                <div class="card dashboard-card">
                    <div class="card-body">
                        <div class="value">$150k</div>
                        <div class="label">Deals Won</div>
                    </div>
                </div>
                <div class="card dashboard-card">
                    <div class="card-body">
                        <div class="value">8</div>
                        <div class="label">Pending Tasks</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Recent Activity</div>
                <div class="card-body activity-list">
                    <div class="activity-item">
                        <i class="activity-icon fas fa-user-plus"></i>
                        <div class="activity-details">
                            <div class="title">New contact added: John Doe</div>
                            <div class="time">2 hours ago</div>
                        </div>
                    </div>
                    <div class="activity-item">
                        <i class="activity-icon fas fa-dollar-sign"></i>
                        <div class="activity-details">
                            <div class="title">Deal Won: Project Alpha</div>
                            <div class="time">5 hours ago</div>
                        </div>
                    </div>
                    <div class="activity-item">
                        <i class="activity-icon fas fa-tasks"></i>
                        <div class="activity-details">
                            <div class="title">Task Completed: Call Jane Smith</div>
                            <div class="time">Yesterday</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
