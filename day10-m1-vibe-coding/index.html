<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM App - Login</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--color-neutral-100);
        }
        .login-container {
            background-color: var(--color-bg-light);
            padding: var(--spacing-xl);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-container h1 {
            font-size: var(--font-size-xl);
            color: var(--color-primary);
            margin-bottom: var(--spacing-lg);
        }
        .input-group {
            margin-bottom: var(--spacing-md);
            text-align: left;
        }
        .form-actions {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-lg);
        }
        .form-actions .btn {
            width: 100%;
        }
        .link-text {
            margin-top: var(--spacing-md);
            font-size: var(--font-size-sm);
        }
        .link-text a {
            color: var(--color-primary);
            font-weight: var(--font-weight-medium);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Welcome Back!</h1>
        <form>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="input-field" placeholder="your@example.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-field" placeholder="********">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Login</button>
                <a href="#" class="link-text">Forgot Password?</a>
            </div>
        </form>
        <div class="link-text">
            Don't have an account? <a href="register.html">Sign Up</a>
        </div>
    </div>

     <script>
        document.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault(); // stop the default page reload/GET submission

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            // TODO: replace with real validation / API call
            if (email && password) {
                window.location.href = 'dashboard.html';
            } else {
                alert('Please enter both email and password.');
            }
        });
    </script>
</body>
</html>
